<head th:fragment="head">
    <title>Somos3</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>

<header th:fragment="header(activo)">
    <nav class="navbar navbar-expand-md py-3">
        <div class="container-fluid px-4 px-lg-5">
            <a th:href="@{/}" class="navbar-brand">
                <img th:src="@{/img/logoSomos3.jpeg}" th:alt="#{aplicacion.titulo}" height="70"/>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarCollapse" th:aria-label="#{plantilla.menu}">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav mx-auto gap-md-4">
                    <li class="nav-item px-2">
                        <a class="nav-link text-dark text-uppercase"
                           th:classappend="${activo == 'inicio'} ? 'text-decoration-underline'"
                           th:href="@{/}">[[#{plantilla.inicio}]]</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link text-dark text-uppercase"
                           th:classappend="${activo == 'catalogo'} ? 'text-decoration-underline'"
                           th:href="@{/catalogo/listado}">[[#{plantilla.catalogo}]]</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link text-dark text-uppercase"
                           th:classappend="${activo == 'categorias'} ? 'text-decoration-underline'"
                           href="#">[[#{plantilla.categorias}]]</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link text-dark text-uppercase"
                           th:classappend="${activo == 'contacto'} ? 'text-decoration-underline'"
                           href="#">[[#{plantilla.contacto}]]</a>
                    </li>
                </ul>
                <div>
                    <a href="#" class="text-dark" th:aria-label="#{plantilla.buscar}"><i class="fa-solid fa-magnifying-glass"></i></a>
                    <a href="#" class="text-dark" th:aria-label="#{plantilla.carrito}"><i class="fa-solid fa-bag-shopping"></i></a>
                    <a href="#" class="text-dark" th:aria-label="#{plantilla.cuenta}"><i class="fa-regular fa-user"></i></a>
                </div>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer">
    <p class="lead text-center mb-0">[[#{plantilla.derechos}]] &copy;</p>
</footer>

<section th:fragment="mostrarToast">
    <div aria-live="polite" aria-atomic="true" 
         class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">                
        <div th:if="${error}" class="toast show"
             role="alert"
             aria-live="assertive"                     
             aria-atomic="true"
             data-bs-autohide="true">
            <div class="toast-header text-white bg-danger">
                <i class="fa-solid fa-bomb"></i> <strong class="me-auto"> [[#{error}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${error}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" 
                            data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
        <div th:if="${todoOk}" class="toast show"
             role="status"
             aria-live="polite"
             aria-atomic="true"
             data-bs-autohide="true">
            <div class="toast-header text-white bg-success">
                <i class="fa-solid fa-square-check"></i> <strong class="me-auto"> [[#{atencion}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${todoOk}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" 
                            data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
    </div>
</section>
