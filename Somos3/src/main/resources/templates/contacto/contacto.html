<!DOCTYPE html>

                    <p class="fs-5 mb-4">Estamos listas para ayudarte.</p>
                    <a class="contacto-whatsapp" href="https://wa.me/50688245817?text=Hola%20Somos%20Tres,%20me%20gustaría%20realizar%20un%20pedido" target="_blank" rel="noopener">

    <section class="contacto-franja text-center">

<footer th:replace="~{general/fragmentos :: footer}"></footer>
